<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #0b0f14; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; background: #0b0f14; overflow: hidden; color: #f7efdc; }
  .hl { font-family: 'Anton', sans-serif; text-transform: uppercase; letter-spacing: 1px; line-height: 1.05; white-space: nowrap; }
  .body { font-family: 'Inter', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .r { color: #ff6b6b; } .g { color: #3ddc84; } .y { color: #ffd166; } .b { color: #7cc4ff; }
  .term { border: 5px solid; border-radius: 20px; box-sizing: border-box; overflow: hidden; }
  .tbar { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 3px solid; }
  .tbar i { width: 16px; height: 16px; border-radius: 8px; display: inline-block; }
  .tbar span { font-family: 'JetBrains Mono', monospace; font-size: 22px; color: #6b7a8c; margin-left: 10px; }
  .tbody { font-family: 'JetBrains Mono', monospace; padding: 16px 26px; line-height: 1.45; white-space: pre; }
  .cur { display: inline-block; width: .55em; height: 1em; background: #f7efdc; vertical-align: -0.12em; margin-left: 2px; }
  .key { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 44px; font-weight: 600; min-width: 56px; text-align: center; padding: 10px 20px; border: 4px solid; border-bottom-width: 9px; border-radius: 14px; }
  .plus { font-family: 'Anton'; font-size: 40px; color: #6b7a8c; margin: 0 14px; }
  .pill { display: inline-block; font-family: 'JetBrains Mono', monospace; font-weight: 600; padding: 8px 24px; border: 4px solid; border-radius: 999px; white-space: nowrap; }
  .tag { position: absolute; top: -24px; left: 26px; font-family: 'Anton'; font-size: 30px; letter-spacing: 1px; padding: 2px 16px; border-radius: 10px; white-space: nowrap; }
  .mtab { font-family: 'JetBrains Mono', monospace; font-size: 22px; color: #6b7a8c; border: 3px solid #2a3542; border-radius: 10px; padding: 6px 16px; }
  .bubble { font-family: 'Inter'; font-size: 38px; font-weight: 600; color: #0b0f14; background: #f7efdc; padding: 26px 34px; border-radius: 28px 28px 28px 6px; max-width: 700px; line-height: 1.3; }
  .bubble.agent { background: #3ddc84; border-radius: 28px 28px 6px 28px; }
  #chrome { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
</style>
</head>
<body>
<div id="stage"><div id="scene"></div><div id="chrome"></div></div>
<script src="lib.js"></script>
<script src="scenes.js"></script>
<script>
  // timeline: [{ start, dur, starts: [segment start offsets] }] per scene, from build-audio.mjs
  let TL = null;
  window.setup = tl => { TL = tl; };
  function ctxFor(i, t) {
    const sc = TL[i], st = sc.starts;
    let seg = 0; st.forEach((s, k) => { if (t >= s) seg = k; });
    const S = k => st[k] ?? 0;
    return {
      t, D: sc.dur, seg, st: S,
      p: (k, d = 0, dur = 0.55) => easeOut(clamp((t - S(k) - d) / dur)),
      lin: (k, d = 0, dur = 1) => clamp((t - S(k) - d) / dur),
      on: (k, d = 0) => t >= S(k) + d,
      typed: (s, k, d = 0, cps = 20) => s.slice(0, Math.floor(clamp((t - S(k) - d) * cps, 0, s.length))),
    };
  }
  window.renderFrame = T => {
    let i = TL.findIndex(s => T < s.start + s.dur); if (i < 0) i = TL.length - 1;
    const sc = TL[i], t = T - sc.start;
    const fade = Math.min(1, t / 0.35, (sc.dur - t) / 0.3);
    const el = document.getElementById('scene');
    el.style.opacity = clamp(fade);
    el.innerHTML = SCENES[i].render(ctxFor(i, t));
    const total = TL[TL.length - 1].start + TL[TL.length - 1].dur;
    document.getElementById('chrome').innerHTML =
      `<div class="mono" style="position:absolute;left:40px;top:28px;font-size:22px;color:${C.muted};letter-spacing:2px">${String(i + 1).padStart(2, '0')} / ${TL.length} &middot; ${SCENES[i].chapter}</div>` +
      `<div class="hl" style="position:absolute;right:40px;top:22px;font-size:30px;color:${C.muted}">REX <span style="color:${C.green}">101</span></div>` +
      `<div style="position:absolute;left:0;bottom:0;height:6px;width:${(T / total) * 100}%;background:${C.green}"></div>`;
  };
</script>
</body>
</html>
